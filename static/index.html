<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zLight Bypass API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #22d3ee;
    --text: #d4e4f7;
    --muted: #5b6b8a;
    --green: #00ff9d;
    --red: #ff3b6b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.07) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(55deg) scale(2);
    transform-origin: center bottom;
    animation: gridMove 12s linear infinite;
    z-index: 0;
    opacity: 0.5;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 0 60px; }
  }

  .glow-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .orb1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; animation: float1 18s ease-in-out infinite; }
  .orb2 { width: 450px; height: 450px; background: var(--accent2); bottom: -150px; right: -150px; animation: float2 22s ease-in-out infinite; }

  @keyframes float1 {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(120px, 80px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0,0); }
    50% { transform: translate(-100px, -60px); }
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1100px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 60px;
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), #fff, var(--accent2), var(--accent));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 6s linear infinite;
    text-shadow: 0 0 60px rgba(0, 229, 255, 0.5);
    line-height: 1.1;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .subtitle {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(10, 14, 26, 0.7);
    border: 1px solid rgba(0, 229, 255, 0.25);
    backdrop-filter: blur(10px);
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
  }
  .dot.online {
    background: var(--green);
    animation: pulseGreen 1.8s infinite;
  }
  .dot.offline {
    background: var(--red);
    animation: pulseRed 1.8s infinite;
  }

  @keyframes pulseGreen {
    0% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0.6); }
    70% { box-shadow: 0 0 0 12px rgba(0, 255, 157, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 255, 157, 0); }
  }
  @keyframes pulseRed {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 107, 0.6); }
    70% { box-shadow: 0 0 0 12px rgba(255, 59, 107, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 107, 0); }
  }

  .terminal {
    background: linear-gradient(180deg, rgba(8, 12, 22, 0.95), rgba(5, 6, 10, 0.98));
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(0, 229, 255, 0.05),
      0 20px 60px rgba(0, 0, 0, 0.6),
      0 0 80px rgba(0, 229, 255, 0.08) inset;
    overflow: hidden;
    margin-bottom: 40px;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .terminal:hover {
    transform: translateY(-4px) rotateX(1deg);
  }

  .term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(0, 229, 255, 0.04);
    border-bottom: 1px solid rgba(0, 229, 255, 0.1);
  }

  .term-bar .btn {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .btn.r { background: #ff5f56; }
  .btn.y { background: #ffbd2e; }
  .btn.g { background: #27c93f; }

  .term-title {
    margin-left: 12px;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .term-body {
    padding: 22px 24px;
    font-size: 0.88rem;
    line-height: 1.7;
    min-height: 280px;
    max-height: 380px;
    overflow-y: auto;
    color: var(--text);
  }

  .term-body::-webkit-scrollbar { width: 6px; }
  .term-body::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 3px; }

  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-line .prompt { color: var(--accent); }
  .term-line .ok { color: var(--green); }
  .term-line .err { color: var(--red); }
  .term-line .info { color: var(--accent3); }
  .term-line .dim { color: var(--muted); }

  .caret {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: var(--accent);
    vertical-align: middle;
    animation: blink 1s steps(1) infinite;
    margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .stat {
    background: rgba(10, 14, 26, 0.6);
    border: 1px solid rgba(0, 229, 255, 0.15);
    border-radius: 12px;
    padding: 22px 20px;
    backdrop-filter: blur(10px);
    text-align: center;
    transition: all 0.3s ease;
  }

  .stat:hover {
    border-color: rgba(0, 229, 255, 0.5);
    transform: translateY(-3px);
    box-shadow: 0 10px 40px rgba(0, 229, 255, 0.15);
  }

  .stat .label {
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .stat .value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
  }

  .cta-wrap {
    text-align: center;
    margin-top: 20px;
  }

  .tg-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 34px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0088cc, #00b4ff);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 2px;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow:
      0 0 0 1px rgba(0, 180, 255, 0.4),
      0 10px 40px rgba(0, 136, 204, 0.4),
      0 0 80px rgba(0, 180, 255, 0.25);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .tg-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
  }

  .tg-btn:hover::before { transform: translateX(100%); }

  .tg-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 0 0 1px rgba(0, 180, 255, 0.6),
      0 16px 50px rgba(0, 136, 204, 0.6),
      0 0 120px rgba(0, 180, 255, 0.4);
  }

  .tg-btn svg {
    width: 22px;
    height: 22px;
    fill: #fff;
  }

  footer {
    text-align: center;
    margin-top: 60px;
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 2px;
  }

  footer .brand {
    color: var(--accent);
    font-weight: 700;
  }

  @media (max-width: 600px) {
    .wrap { padding: 40px 16px 60px; }
    .term-body { font-size: 0.78rem; padding: 16px; }
    .stat .value { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<div class="wrap">

  <header>
    <h1 class="title">zLight Bypass API</h1>
    <p class="subtitle">// link shortener bypass engine</p>
    <div class="status-pill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">checking...</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Status</div>
      <div class="value" id="statStatus">—</div>
    </div>
    <div class="stat">
      <div class="label">Latency</div>
      <div class="value" id="statLatency">—</div>
    </div>
    <div class="stat">
      <div class="label">Uptime</div>
      <div class="value" id="statUptime">—</div>
    </div>
    <div class="stat">
      <div class="label">Version</div>
      <div class="value">v1.0</div>
    </div>
  </div>

  <div class="terminal">
    <div class="term-bar">
      <span class="btn r"></span>
      <span class="btn y"></span>
      <span class="btn g"></span>
      <span class="term-title">zlight@api ~ $</span>
    </div>
    <div class="term-body" id="termBody"></div>
  </div>

  <div class="cta-wrap">
    <a class="tg-btn" href="https://t.me/lightofficials" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
      Join Telegram Channel
    </a>
  </div>

  <footer>
    Built by <span class="brand">zLight</span> · <span id="year"></span>
  </footer>

</div>

<script>
  const termBody = document.getElementById('termBody');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const statStatus = document.getElementById('statStatus');
  const statLatency = document.getElementById('statLatency');
  const statUptime = document.getElementById('statUptime');

  document.getElementById('year').textContent = new Date().getFullYear();

  const startTime = Date.now();

  function line(html, delay = 0) {
    return new Promise(res => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'term-line';
        div.innerHTML = html;
        termBody.appendChild(div);
        termBody.scrollTop = termBody.scrollHeight;
        res();
      }, delay);
    });
  }

  async function bootSequence() {
    await line('<span class="prompt">zlight@api:~$</span> booting bypass engine...', 200);
    await line('<span class="ok">[ OK ]</span> loading core modules', 350);
    await line('<span class="ok">[ OK ]</span> initializing playwright chromium', 400);
    await line('<span class="ok">[ OK ]</span> mounting plugin registry (187 handlers)', 400);
    await line('<span class="ok">[ OK ]</span> adblock-detection bypass active', 350);
    await line('<span class="ok">[ OK ]</span> smart fallback online', 350);
    await line('<span class="info">[ * ]</span> probing /health endpoint...', 300);

    await checkHealth();

    await line('<span class="prompt">zlight@api:~$</span> ready <span class="caret"></span>', 300);
  }

  async function checkHealth() {
    const t0 = performance.now();
    try {
      const r = await fetch('/health', { cache: 'no-store' });
      const latency = Math.round(performance.now() - t0);

      if (r.ok) {
        statusDot.classList.add('online');
        statusText.textContent = 'api online';
        statStatus.textContent = 'ONLINE';
        statStatus.style.color = 'var(--green)';
        statLatency.textContent = latency + 'ms';

        const up = Math.floor((Date.now() - startTime) / 1000);
        statUptime.textContent = up + 's';

        await line(`<span class="ok">[ OK ]</span> health check passed · ${latency}ms`, 200);
      } else {
        throw new Error('non-200');
      }
    } catch (e) {
      statusDot.classList.add('offline');
      statusText.textContent = 'api offline';
      statStatus.textContent = 'OFFLINE';
      statStatus.style.color = 'var(--red)';
      statLatency.textContent = '—';
      await line('<span class="err">[ ERR ]</span> health check failed', 200);
    }
  }

  setInterval(async () => {
    try {
      const r = await fetch('/health', { cache: 'no-store' });
      if (r.ok) {
        statusDot.classList.remove('offline');
        statusDot.classList.add('online');
        statusText.textContent = 'api online';
        statStatus.textContent = 'ONLINE';
        statStatus.style.color = 'var(--green)';
      } else throw new Error();
    } catch {
      statusDot.classList.remove('online');
      statusDot.classList.add('offline');
      statusText.textContent = 'api offline';
      statStatus.textContent = 'OFFLINE';
      statStatus.style.color = 'var(--red)';
    }
  }, 15000);

  bootSequence();
</script>

</body>
</html>
